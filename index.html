// RENDER: pick the target, draw the frame, then (classic) scale it up
// ---------------------------------------------------------------------
function render() {
  if (HD) { ctx = mainCtx; ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.imageSmoothingEnabled = true; }
  else    { ctx = lowCtx;  ctx.setTransform(1, 0, 0, 1, 0, 0); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  if (state === 'title') { HD ? drawTitleHD() : drawTitle(); }
  else {
    rect(0, 0, SCREEN_W, SCREEN_H, '#000');
    const sx = shake > 0 ? rnd(-1, 1) * shake * 6 : 0, sy = shake > 0 ? rnd(-1, 1) * shake * 6 : 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
    ctx.translate(-roomX * VIEW_W + sx, -roomY * VIEW_H + sy);     // camera = current room (+ shake)
    if (HD) drawWorldHD();
    else { drawTiles(); drawLanterns(); drawMiner(); drawEnemies(); drawDynamite(); drawNuggets(); drawPlayer(); drawParticles(); drawTextParticles(); }
    ctx.restore();
    if (flash > 0) { ctx.globalAlpha = HD ? 0.55 * flash / 0.12 : 0.85; rect(0, 0, VIEW_W, VIEW_H, '#fff8e0'); ctx.globalAlpha = 1; }
    if (HD) {   // gentle vignette
      const v = ctx.createRadialGradient(160, 88, 70, 160, 88, 210);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    HD ? drawHUDHD() : drawHUD();
    if (paused) centerBanner([['PAUSED', '#f0d030'], ['press P to continue']]);
    else if (state === 'levelDone') centerBanner([['MINER RESCUED!', '#40e040'], ['counting bonus...']]);
    else if (state === 'gameover') centerBanner([['GAME OVER', '#ff5040'], ['score ' + score + '   money $' + money], ['press Enter']]);
    else if (state === 'win') centerBanner([['ALL MINERS RESCUED!', '#40e040'], ['score ' + score + '   money $' + money], ['press Enter']]);
  }

  if (!HD) {   // blow the 320x200 frame up to the big canvas with no smoothing
    mainCtx.setTransform(1, 0, 0, 1, 0, 0); mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(lowCanvas, 0, 0, canvas.width, canvas.height);
  }
}

// ---------------------------------------------------------------------
// TUNING PANEL – sliders that edit PHYS while you play
// ---------------------------------------------------------------------
const SLIDERS = [
  'Moving',
  ['maxSpeed',    'Top speed',      40, 220, 1],
  ['groundAccel', 'Ground accel',   100, 3000, 10],
  ['groundDecel', 'Ground decel',   100, 3000, 10],
  ['airAccel',    'Air accel',      50, 2000, 10],
  ['airDecel',    'Air decel',      0, 2000, 10],
  'Prop-pack & gravity',
  ['thrust',      'Thrust',         300, 2500, 10],
  ['brake',       'Fall brake',     0, 2000, 10],
  ['spinUp',      'Spin-up (s)',    0.01, 0.5, 0.01],
  ['maxRise',     'Max climb',      40, 300, 1],
  ['gravity',     'Gravity',        100, 1200, 10],
  ['maxFall',     'Max fall',       60, 400, 1],
  // Sound sliders edit COMP / MIX instead of PHYS, and call a function to apply the change.
  'Sound: compression',
  ['on',        'Compressor (0/1)', 0, 1, 1,         COMP, applyComp],
  ['threshold', 'Threshold dB',   -50, 0, 1,         COMP, applyComp],
  ['ratio',     'Ratio',          1, 12, 0.5,        COMP, applyComp],
  ['attack',    'Attack (s)',     0.001, 0.1, 0.001, COMP, applyComp],
  ['release',   'Release (s)',    0.05, 1, 0.01,     COMP, applyComp],
  ['makeup',    'Makeup dB',      0, 15, 0.5,        COMP, applyComp],
  'Sound: levels (dB)',
  ['master',    'Master',         -30, 6, 1,         MIX, applyMaster],
  ['explosion', 'Explosion',      -30, 0, 1,         MIX],
  ['laser',     'Laser',          -40, 0, 1,         MIX],
  ['rotor',     'Rotor',          -40, 0, 1,         MIX],
  ['effects',   'Beeps & coins',  -12, 12, 1,        MIX],
];
const sliderSyncs = [];
(function buildTuningPanel() {
  const box = document.getElementById('sliders');
  for (const item of SLIDERS) {
    if (typeof item === 'string') { const h = document.createElement('h4'); h.textContent = item; box.appendChild(h); continue; }
    const [key, label, min, max, stepSize, obj = PHYS, onChange] = item;
    const row = document.createElement('label'); row.className = 'srow';
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${stepSize}"><output></output>`;
    const input = row.querySelector('input'), out = row.querySelector('output');
    const sync = () => { input.value = obj[key]; out.textContent = obj[key]; if (onChange) onChange(); };
    input.addEventListener('input', () => { obj[key] = +input.value; out.textContent = input.value; if (onChange) onChange(); });
    input.addEventListener('change', () => canvas.focus());   // hand the keyboard back to the game
    box.appendChild(row); sliderSyncs.push(sync); sync();
  }
  const hint = document.createElement('div'); hint.className = 'hint';
  hint.textContent = 'Thrust must be bigger than gravity or you can\'t climb. Low air decel = drifty, high = tight. ' +
    'Compression: turn it off (0) and on (1) while hovering + firing to hear the difference.';
  box.appendChild(hint);
  // live gain-reduction meter: how many dB the compressor is turning the mix down right now
  const meter = document.createElement('div'); meter.className = 'hint'; meter.id = 'grMeter';
  meter.innerHTML = 'Compressing: <span id="grVal">0.0</span> dB <div style="background:#333;height:5px;width:200px;border-radius:3px"><div id="grBar" style="background:#ff8040;height:5px;width:0;border-radius:3px"></div></div>';
  box.appendChild(meter);
  document.getElementById('resetPhys').addEventListener('click', () => {
    Object.assign(PHYS, PHYS_DEFAULTS); Object.assign(COMP, COMP_DEFAULTS); Object.assign(MIX, MIX_DEFAULTS);
    sliderSyncs.forEach(f => f()); canvas.focus();
  });
  document.getElementById('copyPhys').addEventListener('click', () => {
    const txt = 'const PHYS_DEFAULTS = ' + JSON.stringify(PHYS, null, 2) + ';\n' +
                'const MIX_DEFAULTS = ' + JSON.stringify(MIX, null, 2) + ';\n' +
                'const COMP_DEFAULTS = ' + JSON.stringify(COMP) + ';';
    document.getElementById('physOut').textContent = txt;    // also shown, in case copying is blocked
    try { navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
    canvas.focus();
  });
})();

// ---------------------------------------------------------------------
// 7. MAIN LOOP — fixed 60 updates per second, draw once per frame
// ---------------------------------------------------------------------
const STEP = 1 / 60;
const grVal = document.getElementById('grVal'), grBar = document.getElementById('grBar');
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  render();
  updateSoundLoops();
  if (compNode && grVal) {   // update the compression meter in the tuning panel
    const gr = typeof compNode.reduction === 'number' ? compNode.reduction : compNode.reduction.value;
    grVal.textContent = gr.toFixed(1); grBar.style.width = Math.min(200, -gr * 10) + 'px';
  }
  requestAnimationFrame(frame);
}
function fit() {   // fill the window while keeping the 320x200 (8:5) shape
  const s = Math.max(0.5, Math.min(innerWidth / SCREEN_W, (innerHeight - 50) / SCREEN_H));
  canvas.style.width = Math.floor(SCREEN_W * s) + 'px'; canvas.style.height = Math.floor(SCREEN_H * s) + 'px';
}
addEventListener('resize', fit); fit(); applyGfxMode();
canvas.focus();
requestAnimationFrame(frame);
</script>
