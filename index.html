<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop-Pack Rescue — a H.E.R.O.-style remake</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #bbb; font-family: monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* The canvas is 1280x800 (4x the game's 320x200 world). In CLASSIC mode the game draws
     at 320x200 and is blown up with no smoothing; in ENHANCED mode it draws at full 4x detail. */
  canvas { background: #000; outline: none; cursor: pointer; }
  canvas.classic { image-rendering: pixelated; image-rendering: crisp-edges; }
  #help { font-size: 13px; margin-top: 10px; text-align: center; opacity: .75; line-height: 1.6; }
  #tuning { position: fixed; top: 8px; right: 8px; z-index: 2; background: rgba(18,18,18,.94);
            border: 1px solid #333; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #ccc;
            max-height: calc(100vh - 16px); overflow: auto; }
  #tuning summary { cursor: pointer; color: #f0d030; font-weight: bold; }
  #tuning h4 { margin: 10px 0 2px; color: #ff8040; font-size: 12px; }
  .srow { display: grid; grid-template-columns: 112px 140px 44px; align-items: center; gap: 6px; margin: 3px 0; }
  .srow output { text-align: right; color: #fff; }
  .hint { color: #777; font-size: 11px; max-width: 310px; margin: 4px 0; }
  #tuning button { background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; margin: 8px 4px 2px 0; cursor: pointer; font-family: monospace; }
  #physOut { white-space: pre; font-size: 11px; color: #9c9; margin: 6px 0 0; }
  kbd { border: 1px solid #555; border-radius: 3px; padding: 0 4px; color: #eee; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" tabindex="0"></canvas>
<div id="help">
  <kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>↑</kbd> prop-pack (hold) &nbsp; <kbd>Space</kbd> laser &nbsp;
  <kbd>↓</kbd> dynamite &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>G</kbd> classic / enhanced graphics &nbsp; <kbd>T</kbd> textures on/off
</div>
<details id="tuning">
  <summary>Tuning: physics &amp; sound</summary>
  <div id="sliders"></div>
  <button id="resetPhys">Reset to defaults</button><button id="copyPhys">Copy values</button>
  <div id="physOut"></div>

/* =====================================================================
   PROP-PACK RESCUE
   A from-scratch remake of the gameplay of Activision's H.E.R.O. (1984),
   written for learning. All code and graphics are original.

   HOW THE CODE IS ORGANISED
     1. Constants        – every tunable number in one place
     2. Level data       – maps drawn as text, one character per tile
     3. Input & audio
     4. World helpers    – tile lookups and collision
     5. Game logic       – player, laser, dynamite, enemies, states
     6. Drawing          – everything is plain rectangles on a canvas
     7. Main loop        – fixed 60 Hz update + render
   ===================================================================== */

// ---------------------------------------------------------------------
// 1. CONSTANTS
// ---------------------------------------------------------------------

  airAccel:    380,   // steering while flying (a bit floatier)
  airDecel:    220,   // low = you drift and keep momentum in the air
  // --- up/down ---

const FUSE = 1.1;                      // dynamite fuse in seconds

const BLAST_SELF = 34;                 // ...and the hero, if he's this close!

const POWER_SECONDS = 90;              // a full power meter lasts this long
const START_LIVES = 4;                 // spare heroes
const DYNAMITE_PER_LIFE = 6;

const PTS_ENEMY = 50, PTS_WALL = 75, PTS_MINER = 1000, PTS_DYNAMITE_BONUS = 50;

// Mining. Ore veins sit inside the rock; burn them with the laser or blast them
// with dynamite and nuggets pop out. Pick nuggets up to earn money ($).

};

    deco: { moss: 0.20, grass: 0.05, hang: 0.14, side: 0.10, puddle: 0.28 },   // wet: lots of puddles
    ores: [[19,18,'g'], [3,16,'g'], [15,4,'g'], [34,11,'c'], [0,14,'c'], [39,13,'c'], [32,16,'c'], [21,9,'c']],

      ]),
      ...sideBySide([

    rock: '#8a3aa8', dark: '#5a1a78', light: '#b060d0', wall: '#e0a8f0', bgTop: '#1a0c24', bgBot: '#07030c',
    deco: { moss: 0.08, grass: 0.00, hang: 0.05, side: 0.04, puddle: 0.05 },   // hot and dry near the lava
    ores: [[11,16,'g'], [19,35,'g'], [18,10,'g'], [19,14,'c'], [19,20,'c'], [0,14,'c'], [9,38,'c'], [5,21,'c']],
    map: [
      "####################",

      // ---- room 2 ----
      "#...################",

      // ---- room 4 ----
      "#..#################",

// ---------------------------------------------------------------------
// 3. INPUT & AUDIO
// ---------------------------------------------------------------------
const canvas = document.getElementById('game');
const RES = 4;                                   // enhanced mode draws at 4x
const mainCtx = canvas.getContext('2d');
const lowCanvas = document.createElement('canvas');  // 320x200 buffer for CLASSIC mode
lowCanvas.width = SCREEN_W; lowCanvas.height = SCREEN_H;
const lowCtx = lowCanvas.getContext('2d');
let ctx = mainCtx;                                // whichever one we're drawing into this frame
let HD = true;                                    // true = ENHANCED graphics, false = CLASSIC
function applyGfxMode() { canvas.classList.toggle('classic', !HD); }

const keys = {};      // true while a key is held
const pressed = {};   // true only on the update step the key went down
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'fire', KeyX: 'fire', KeyZ: 'fire', ControlLeft: 'fire',
  KeyP: 'pause', Escape: 'pause', Enter: 'start', KeyM: 'mute', KeyG: 'gfx', KeyT: 'tex',
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  ensureAudio();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
canvas.addEventListener('pointerdown', () => { canvas.focus(); ensureAudio(); pressed.start = true; });

// ---- SOUND MIX ----------------------------------------------------------
// Every sound is set by how LOUD it should be (in dBFS – 0 is the maximum, more
// negative is quieter), not by a raw multiplier. The recordings were measured, so
// the game works out each one's volume to hit its target: the sounds stay balanced
// even if you swap a recording for a louder or quieter one (just update its
// measured loudness below). Every 6 dB is roughly "twice as loud".
const MIX_DEFAULTS = {
  master:    0,     // overall volume trim in dB (e.g. -6 = everything quieter)
  explosion: -13,   // the loudest moment in the game, but no longer deafening
  laser:     -25,
  rotor:     -27,   // a background bed under everything else
  effects:   0,     // dB trim for the synth beeps/clicks/coins (they already sit around -25)
};
const MIX = { ...MIX_DEFAULTS };

// ---- COMPRESSION ----------------------------------------------------------
// A compressor "evens out" the mix: whenever the total sound goes above the
// THRESHOLD it is turned down by the RATIO (3 = every 3 dB over becomes 1 dB over).
// ATTACK is how fast it reacts to a loud sound, RELEASE how fast it lets go.
// Because loud parts get squashed, MAKEUP gain then lifts everything back up –
// so quiet sounds (fuse, coins, rotor) end up louder relative to big ones (blasts).
// After it sits a LIMITER: a very fast, very hard compressor that only catches
// peaks near maximum, so nothing can ever clip/distort.
const COMP_DEFAULTS = { on: 1, threshold: -26, ratio: 3, attack: 0.01, release: 0.25, makeup: 5 };
const COMP = { ...COMP_DEFAULTS };
let compNode = null, makeupNode = null;
function applyComp() {
  if (!compNode) return;
  const t = actx.currentTime, on = COMP.on > 0.5;
  compNode.threshold.setTargetAtTime(on ? COMP.threshold : 0, t, 0.02);   // threshold 0 + ratio 1 = bypass
  compNode.ratio.setTargetAtTime(on ? COMP.ratio : 1, t, 0.02);
  compNode.attack.setTargetAtTime(COMP.attack, t, 0.02);
  compNode.release.setTargetAtTime(COMP.release, t, 0.02);
  makeupNode.gain.setTargetAtTime(on ? dbToGain(COMP.makeup) : 1, t, 0.02);
}
function applyMaster() { if (bus) bus.gain.setTargetAtTime(dbToGain(MIX.master), actx.currentTime, 0.02); }
// Measured average loudness (RMS dBFS) of each embedded recording.
const SAMPLE_LOUDNESS = { explosion: -3.4, laser: -9.3, rotor: -19.2 };
const dbToGain = db => Math.pow(10, db / 20);
const sampleGain = name => dbToGain(MIX[name] - SAMPLE_LOUDNESS[name]);

// Tiny synthesizer using the Web Audio API – no sound files needed.
let actx = null, muted = false, propOsc, propGain, laserOsc, laserGain, fuseFilter, fuseGain;
let bus = null;   // every sound plugs into this; it goes master volume -> limiter -> speakers
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    // Master chain:  bus (master volume) -> compressor -> makeup gain -> limiter -> speakers
    bus = actx.createGain(); bus.gain.value = dbToGain(MIX.master);
    compNode = actx.createDynamicsCompressor(); compNode.knee.value = 10;
    makeupNode = actx.createGain();
    const limiter = actx.createDynamicsCompressor();
    limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
    limiter.attack.value = 0.001; limiter.release.value = 0.1;
    bus.connect(compNode).connect(makeupNode).connect(limiter).connect(actx.destination);
    applyComp();
    // Two oscillators that run constantly; we just turn their volume up/down.
    propOsc = actx.createOscillator(); propOsc.type = 'sawtooth'; propOsc.frequency.value = 50;
    propGain = actx.createGain(); propGain.gain.value = 0;
    propOsc.connect(propGain).connect(bus); propOsc.start();
    laserOsc = actx.createOscillator(); laserOsc.type = 'square'; laserOsc.frequency.value = 900;
    laserGain = actx.createGain(); laserGain.gain.value = 0;
    laserOsc.connect(laserGain).connect(bus); laserOsc.start();
    // Burning fuse: looping white noise through a band-pass filter = a fizzy hiss.
    const len = actx.sampleRate * 2, nb = actx.createBuffer(1, len, actx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
    const fuseSrc = actx.createBufferSource(); fuseSrc.buffer = nb; fuseSrc.loop = true;
    fuseFilter = actx.createBiquadFilter(); fuseFilter.type = 'bandpass'; fuseFilter.frequency.value = 3500; fuseFilter.Q.value = 0.9;
    fuseGain = actx.createGain(); fuseGain.gain.value = 0;
    fuseSrc.connect(fuseFilter).connect(fuseGain).connect(bus); fuseSrc.start();
    loadSamples();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.06, endFreq = 0, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(vol * dbToGain(MIX.effects), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bus); o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(dur, vol = 0.25) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = buf; g.gain.value = vol * dbToGain(MIX.effects); s.connect(g).connect(bus); s.start();
}
// ---- Recorded sound samples ------------------------------------------
// The dynamite blast uses a real explosion recording, embedded below as base64
// (the page can't load outside files). Its silent lead-in was trimmed so the
// bang lands on the same frame as the flash.
let boomBuffer = null, laserBuffer = null, heliBuffer = null;   // decoded audio, ready to play
let samplesRequested = false;
function decodeSample(b64, done) {
  try {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    actx.decodeAudioData(bytes.buffer, done, () => {});
  } catch (e) {}
}
function loadSamples() {
  if (!actx || samplesRequested) return;
  samplesRequested = true;
  decodeSample(EXPLOSION_MP3, buf => { boomBuffer = buf; });
  decodeSample(LASER_WAV, buf => { laserBuffer = buf; });
  decodeSample(HELI_WAV, buf => { heliBuffer = buf; startRotorLoop(); });
}

// The prop-pack: a ~3 s helicopter recording cut on matching rotor "chops" with the
// seam cross-faded, so it loops forever. It runs silently all the time; we just fade
// its volume in when you thrust and out when you let go (and spool the pitch up/down).
const ROTOR_FADE_IN = 0.12, ROTOR_FADE_OUT = 0.3;   // seconds (time constants – bigger = smoother)
let heliSrc = null, heliGain = null;
function startRotorLoop() {
  if (!actx || heliSrc || !heliBuffer) return;
  heliSrc = actx.createBufferSource(); heliSrc.buffer = heliBuffer; heliSrc.loop = true;
  heliSrc.playbackRate.value = 0.8;
  heliGain = actx.createGain(); heliGain.gain.value = 0;
  heliSrc.connect(heliGain).connect(bus); heliSrc.start();
}

// The laser recording is one long blast. It plays its attack once, then loops a
// stretch of the steady middle for as long as fire is held. The end of that stretch
// was cross-faded into its start when the sample was prepared, so the loop is seamless.
const LASER_TONE = 2600;       // low-pass cutoff in Hz: lower = mellower, higher = brighter/harsher
const LASER_LOOP_START = 0.215000, LASER_LOOP_END = 0.605000;   // seconds into the sample
let laserSrc = null, laserSrcGain = null;
function startLaserSample() {
  if (laserSrc || !laserBuffer || muted) return;
  laserSrc = actx.createBufferSource(); laserSrc.buffer = laserBuffer;
  laserSrc.loop = true; laserSrc.loopStart = LASER_LOOP_START; laserSrc.loopEnd = LASER_LOOP_END;
  // Soften it: a low-pass filter takes the edge off the high frequencies, and a short
  // fade-in (~15 ms) removes the hard "click" at the start of each burst.
  const tone = actx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = LASER_TONE; tone.Q.value = 0.5;
  laserSrcGain = actx.createGain();
  laserSrcGain.gain.setValueAtTime(0, actx.currentTime);
  laserSrcGain.gain.setTargetAtTime(sampleGain('laser'), actx.currentTime, 0.015);
  laserSrc.connect(tone).connect(laserSrcGain).connect(bus); laserSrc.start();
}
function stopLaserSample() {
  if (!laserSrc) return;
  const t = actx.currentTime;
  laserSrcGain.gain.setTargetAtTime(0, t, 0.02);    // short fade-out when you let go
  laserSrc.stop(t + 0.15); laserSrc = null;
}
function playSample(buf, vol = 1, rate = 1) {
  if (!actx || muted || !buf) return false;
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = buf; src.playbackRate.value = rate; g.gain.value = vol;
  src.connect(g).connect(bus); src.start();
  return true;
}

function updateSoundLoops() {
  if (!actx) return;
  const t = actx.currentTime, live = state === 'playing' && !paused && !muted;
  const spin = player ? Math.min(1, player.spin / Math.max(0.01, PHYS.spinUp)) : 0;
  if (heliSrc) {                         // recorded rotor with smooth taper in/out
    const thrusting = live && player && keys.up;
    heliGain.gain.setTargetAtTime(thrusting ? sampleGain('rotor') : 0, t, thrusting ? ROTOR_FADE_IN : ROTOR_FADE_OUT);
    heliSrc.playbackRate.setTargetAtTime(thrusting ? 1 : 0.8, t, thrusting ? 0.15 : 0.4);   // spool up / wind down
    propGain.gain.setTargetAtTime(0, t, 0.03);
  } else {                               // synth fallback
    propGain.gain.setTargetAtTime(live ? 0.03 * spin : 0, t, 0.03);
    propOsc.frequency.setTargetAtTime(35 + 55 * spin, t, 0.05);
  }
  const firingNow = live && player && player.firing;
  if (laserBuffer) {                     // recorded laser
    laserGain.gain.setTargetAtTime(0, t, 0.01);
    if (firingNow) startLaserSample(); else stopLaserSample();
  } else {                               // synth fallback
    laserGain.gain.setTargetAtTime(firingNow ? 0.025 : 0, t, 0.01);
    laserOsc.frequency.setValueAtTime(700 + Math.random() * 600, t);
  }
  // Fuse hiss: on while dynamite is burning, flickering, and rising in pitch as the fuse gets short.
  // It stops by itself the moment the dynamite is gone (exploded, or you died / finished the level).
  if (live && dynamite) {
    const burnt = 1 - Math.max(0, dynamite.fuse) / FUSE;
    fuseGain.gain.setTargetAtTime(0.06 * (0.55 + Math.random() * 0.45) * (0.8 + burnt * 0.5), t, 0.015);
    fuseFilter.frequency.setTargetAtTime(2800 + burnt * 3500 + Math.random() * 600, t, 0.02);
  } else fuseGain.gain.setTargetAtTime(0, t, 0.004);
}

// ---------------------------------------------------------------------
// 4. WORLD HELPERS
// ---------------------------------------------------------------------
let level;   // { def, cols, rows, tiles[][], wallHp }

function tileAt(c, r) {
  if (r < 0 || c < 0 || r >= level.rows || c >= level.cols) return '#';
  return level.tiles[r][c];
}
function isSolid(t) { return t === '#' || t === 'W' || t === 'L' || t === 'g' || t === 'c'; }

// Call fn(tile, col, row) for every tile a rectangle overlaps; stop on true.
function anyTileUnder(x, y, w, h, fn) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.001) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.001) / TILE);
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++)
      if (fn(tileAt(c, r), c, r)) return true;
  return false;
}
const rectHitsSolid = (x, y, w, h) => anyTileUnder(x, y, w, h, isSolid);
const touchesTile = (e, ch) => anyTileUnder(e.x - 1, e.y - 1, e.w + 2, e.h + 2, t => t === ch);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const center = e => ({ x: e.x + e.w / 2, y: e.y + e.h / 2 });

// Move along ONE axis, then push back out of any wall we ended up inside.
// Doing X and Y separately is the classic, simple way to get sliding collisions.
function moveX(e, dx) {
  if (!dx) return false;
  e.x += dx;
  if (!rectHitsSolid(e.x, e.y, e.w, e.h)) return false;
  if (dx > 0) e.x = Math.floor((e.x + e.w - 0.001) / TILE) * TILE - e.w;
  else        e.x = (Math.floor(e.x / TILE) + 1) * TILE;
  return true;
}
function moveY(e, dy) {
  if (!dy) return false;
  e.y += dy;
  if (!rectHitsSolid(e.x, e.y, e.w, e.h)) return false;
  if (dy > 0) e.y = Math.floor((e.y + e.h - 0.001) / TILE) * TILE - e.h;
  else        e.y = (Math.floor(e.y / TILE) + 1) * TILE;
  return true;
}

// ---------------------------------------------------------------------
// 5. GAME LOGIC
// ---------------------------------------------------------------------
let state = 'title';     // title | playing | dying | levelDone | gameover | win
let paused = false;
let levelIndex = 0, score = 0, lives = 0, power = 100, dynamiteLeft = 0, nextExtraLife = 0;
let hiScore = 0;
try { hiScore = +localStorage.getItem('propPackHi') || 0; } catch (e) {}
let player = null, enemies = [], lanterns = [], miner = null, dynamite = null, particles = [];
let roomX = 0, roomY = 0, checkpoint = null, lightsOut = false, flash = 0, shake = 0;
let scorches = [], mapVersion = 0, blasting = false;
let money = 0, nuggets = [];          // money is kept for the whole game – ready for a future shop   // mapVersion changes whenever the map does (for the HD tile cache)
let stateTimer = 0, tallyAcc = 0, tickT = 0, globalT = 0;

function loadLevel(i) {
  const def = LEVELS[i];
  level = { def, cols: def.map[0].length, rows: def.map.length, tiles: [], wallHp: new Map() };
  enemies = []; lanterns = []; miner = null; dynamite = null; particles = []; scorches = []; nuggets = [];
  lightsOut = false; flash = 0; shake = 0; mapVersion++;
  let start = { x: 0, y: 0 };
  def.map.forEach((line, r) => {
    const row = [];
    for (let c = 0; c < line.length; c++) {
      const ch = line[c], x = c * TILE, y = r * TILE;
      let t = ch;
      if (ch === 'P') start = { x: x + 3, y: y + TILE - PH };
      else if (ch === 'X') miner = { x: x + 2, y: y + TILE - 20, w: 12, h: 20 };
      else if (ch === 'B') enemies.push({ type: 'bat', x: x + 1, y: y + 4, baseY: y + 4, w: 14, h: 8, vx: 32, t: Math.random() * 6, alive: true });
      else if (ch === 'M') enemies.push({ type: 'moth', x: x + 3, y: y + 4, homeX: x + 3, homeY: y + 4, w: 10, h: 8, t: Math.random() * 6, alive: true });
      else if (ch === 'S') enemies.push({ type: 'spider', x: x + 2, y: y + 2, top: y + 2, w: 12, h: 10, dir: 1, speed: 24, col: c, row: r, t: 0, alive: true });
      else if (ch === 'T') lanterns.push({ x: x + 4, y: y, w: 8, h: 11, lit: true });
      if ('PXBMST'.includes(ch)) t = '.';
      row.push(t);
    }
    level.tiles.push(row);
  });
  // Place the ore veins listed for this level.
  for (const [c, r, kind] of def.ores || []) if (level.tiles[r] && level.tiles[r][c] === '#') level.tiles[r][c] = kind;
  placeDecorations();
  // Spiders need the finished map: find the ceiling for the thread and how far down they can go.
  for (const e of enemies) if (e.type === 'spider') {
    let rr = e.row; while (rr > 0 && !isSolid(tileAt(e.col, rr - 1))) rr--;
    e.threadTop = rr * TILE;
    let k = 0; while (k < 3 && !isSolid(tileAt(e.col, e.row + k + 1))) k++;
    e.bottom = e.top + k * TILE;
  }
  return start;
}

function startGame() {
  score = 0; money = 0; lives = START_LIVES; nextExtraLife = EXTRA_LIFE_EVERY; levelIndex = 0;
  beginLevel();
}
function beginLevel() {
  const start = loadLevel(levelIndex);
  power = 100; dynamiteLeft = DYNAMITE_PER_LIFE;
  spawnPlayer(start);
  state = 'playing';
}
function spawnPlayer(pos) {
  player = { x: pos.x, y: pos.y, w: PW, h: PH, vx: 0, vy: 0, facing: 1, onGround: false,
             spin: 0, firing: false, beamEnd: 0, walkT: 0, invuln: 1.5 };
  updateRoom(true);
}

// The camera "flips" a whole screen at a time, just like the 2600 original.
function updateRoom(force) {
  const rx = Math.floor((player.x + PW / 2) / VIEW_W);
  const ry = Math.floor((player.y + PH / 2) / VIEW_H);
  if (force || rx !== roomX || ry !== roomY) {
    roomX = rx; roomY = ry;
    checkpoint = { x: player.x, y: player.y };   // respawn here if you die
    lightsOut = false;                           // lights come back in a new room
  }
}

function addScore(n) {
  score += n;
  while (score >= nextExtraLife) { lives++; nextExtraLife += EXTRA_LIFE_EVERY; tone(880, 0.1, 'square', 0.05, 0, 0); tone(1320, 0.15, 'square', 0.05, 0, 0.1); }
}

// ---- PARTICLES ------------------------------------------------------
// Every effect is a particle with a type:
//   spark  – bright streak, falls fast        ember  – glowing bit that drifts and falls slowly
//   fire   – fireball puff that grows & cools smoke  – dark puff that rises and spreads
//   debris – tumbling rock chunk that bounces dust   – small puff kicked up from the floor
//   ring   – expanding shockwave              light  – a flash of light (enhanced mode only)
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
function addP(o) {
  o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0;
  particles.push(o);
  if (particles.length > 1400) particles.shift();
}
function burst(x, y, color, n, speed = 90) {          // a spray of sparks
  for (let i = 0; i < n; i++) {
    const a = rnd(Math.PI * 2), s = rnd(30, 30 + speed);
    addP({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: rnd(0.3, 0.8), color, size: 1 });
  }
}
function smokePuffs(x, y, n, spread = 8) {
  for (let i = 0; i < n; i++)
    addP({ type: 'smoke', x: x + rnd(-spread, spread), y: y + rnd(-spread, spread), vx: rnd(-20, 20), vy: rnd(-25, 0),
           life: rnd(1, 2), size: rnd(4, 8), grow: rnd(8, 16), delay: rnd(0, 0.2) });
}
function debris(x, y, color, n, ox, oy) {           // rock chunks thrown away from (ox, oy)
  for (let i = 0; i < n; i++) {
    const a = ox === undefined ? rnd(Math.PI * 2) : Math.atan2(y - oy, x - ox) + rnd(-0.9, 0.9);
    const s = rnd(50, 200), pts = [];
    for (let k = 0; k < 5; k++) { const t = k / 5 * Math.PI * 2; pts.push([Math.cos(t) * rnd(0.6, 1), Math.sin(t) * rnd(0.6, 1)]); }
    addP({ type: 'debris', x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 70,
           life: rnd(1.4, 2.6), color: Math.random() < 0.3 ? level.def.dark : color, size: rnd(0.9, 2.6),
           rot: rnd(6), vr: rnd(-18, 18), pts });
  }
}
// A layered, "realistic" dynamite blast.
function spawnExplosion(cx, cy) {
  shake = Math.max(shake, 0.95); flash = 0.12;   // the recording rumbles ~1s, so shake a bit longer
  addP({ type: 'light', x: cx, y: cy, life: 0.55, size: 120 });
  addP({ type: 'ring',  x: cx, y: cy, life: 0.35, size: 3, grow: 170 });
  addP({ type: 'ring',  x: cx, y: cy, life: 0.5,  size: 2, grow: 90 });
  for (let i = 0; i < 18; i++) {                     // core fireball
    const a = rnd(Math.PI * 2), s = rnd(15, 85);
    addP({ type: 'fire', x: cx + Math.cos(a) * 3, y: cy + Math.sin(a) * 3, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
           life: rnd(0.3, 0.75), size: rnd(4, 10), grow: rnd(14, 30) });
  }
  for (let i = 0; i < 16; i++) {                     // smoke that lingers after the fire
    const a = rnd(Math.PI * 2), s = rnd(10, 45);
    addP({ type: 'smoke', x: cx + rnd(-10, 10), y: cy + rnd(-8, 8), vx: Math.cos(a) * s, vy: Math.sin(a) * s - 18,
           life: rnd(1.6, 3), size: rnd(5, 10), grow: rnd(9, 18), delay: rnd(0.1, 0.35) });
  }
  for (let i = 0; i < 40; i++) {                     // fast sparks
    const a = rnd(Math.PI * 2), s = rnd(90, 300);
    addP({ type: 'spark', x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: rnd(0.25, 0.75),
           color: Math.random() < 0.5 ? '#fff3a0' : '#ffb040', size: 1 });
  }
  for (let i = 0; i < 16; i++) {                     // slow embers thrown upward
    const a = -Math.PI / 2 + rnd(-1.4, 1.4), s = rnd(40, 140);
    addP({ type: 'ember', x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(1, 2.4), color: '#ff8a30', size: 0.9 });
  }
  debris(cx, cy, level.def.rock, 10, cx, cy + 12);   // chips blasted out of the floor
  scorches.push({ x: cx, y: cy + 4, r: 14 });
}

function updatePlaying(dt) {
  const p = player;

  // Power drains constantly – it's your timer.
  power -= (100 / POWER_SECONDS) * dt;
  if (power <= 0) { power = 0; killPlayer(); return; }
  if (p.invuln > 0) p.invuln -= dt;

  // --- Horizontal movement with acceleration and deceleration ---
  // Holding a direction speeds you up toward maxSpeed; letting go slows you down.
  // On the ground you grip well; in the air you keep more of your momentum.
  const ix = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (ix) p.facing = ix;
  const accel = p.onGround ? PHYS.groundAccel : PHYS.airAccel;
  const decel = p.onGround ? PHYS.groundDecel : PHYS.airDecel;
  if (ix !== 0) {
    // Pushing against your current motion? Brake AND accelerate, for a snappy turn-around.
    const rate = (p.vx * ix < 0) ? accel + decel : accel;
    p.vx += ix * rate * dt;
    if (Math.abs(p.vx) > PHYS.maxSpeed) p.vx = Math.sign(p.vx) * PHYS.maxSpeed;
  } else {
    const d = decel * dt;
    p.vx = Math.abs(p.vx) <= d ? 0 : p.vx - Math.sign(p.vx) * d;
  }

  // --- Prop-pack: a short spin-up, then thrust (plus extra "brake" if you're falling) ---
  if (keys.up) p.spin = Math.min(PHYS.spinUp, p.spin + dt);
  else         p.spin = Math.max(0, p.spin - dt);
  p.vy += PHYS.gravity * dt;
  if (keys.up && p.spin >= PHYS.spinUp) {
    p.vy -= PHYS.thrust * dt;
    if (p.vy > 0) p.vy -= PHYS.brake * dt;
  }
  p.vy = Math.max(-PHYS.maxRise, Math.min(PHYS.maxFall, p.vy));

  if (moveX(p, p.vx * dt)) p.vx = 0;          // hit a wall: lose your speed
  p.onGround = false;
  if (moveY(p, p.vy * dt)) { if (p.vy > 0) p.onGround = true; p.vy = 0; }
  if (p.onGround) p.walkT += dt * Math.abs(p.vx) / 72;   // legs move faster at speed

  if (touchesTile(p, 'L')) { killPlayer(); return; }

  // --- Helmet laser (hold fire) ---
  p.firing = !!keys.fire;
  p.fireT = p.firing ? (p.fireT || 0) + dt : 0;   // time since the trigger was pressed
  if (p.firing) fireLaser(dt);

  // --- Dynamite: drop it, then get clear! ---
  if (pressed.down && p.onGround && dynamiteLeft > 0 && !dynamite) {
    dynamite = { x: p.x + PW / 2 - 2, y: p.y + PH - 9, fuse: FUSE };
    dynamiteLeft--;
    noiseBurst(0.12, 0.12); tone(220, 0.05, 'square', 0.04);   // strike + thunk as it's dropped
  }
  // Rotor wash: kick up dust when hovering just above the floor.
  if (keys.up && p.spin > 0 && Math.random() < 0.6) {
    const cx = p.x + PW / 2;
    for (let d = 0; d <= 22; d += 4) {
      const gy = p.y + PH + d;
      if (isSolid(tileAt(Math.floor(cx / TILE), Math.floor(gy / TILE)))) {
        const floorY = Math.floor(gy / TILE) * TILE, side = Math.random() < 0.5 ? -1 : 1;
        addP({ type: 'dust', x: cx + side * rnd(1, 4), y: floorY - 1, vx: side * rnd(30, 70) * (1 - d / 30), vy: rnd(-12, -2),
               life: rnd(0.35, 0.7), size: rnd(1, 2), grow: rnd(4, 8) });
        break;
      }
    }
  }
  if (dynamite) {
    if (Math.random() < 0.12) tone(rnd(1800, 5000), 0.012, 'square', 0.025);   // fuse crackle
    if (Math.random() < 0.7) { const t = fuseTip(); addP({ type: 'spark', x: t.x, y: t.y, vx: rnd(-30, 30), vy: rnd(-50, -10), life: rnd(0.1, 0.3), color: '#ffe070', size: 0.7 }); }
    dynamite.fuse -= dt;
    if (dynamite.fuse <= 0) { explode(); if (state !== 'playing') return; }
  }

  // --- Enemies ---
  for (const e of enemies) if (e.alive) updateEnemy(e, dt);
  if (p.invuln <= 0) for (const e of enemies) if (e.alive && overlap(p, e)) { killPlayer(); return; }

  // --- Nuggets: bounce around and get collected ---
  updateNuggets(dt);

  // --- Lanterns: bump one and the lights go out in this room ---
  for (const l of lanterns) if (l.lit && overlap(p, l)) {
    l.lit = false; lightsOut = true; tone(180, 0.4, 'triangle', 0.08, 60);
  }

  updateDecorations(dt);

  // --- Reached the miner? ---
  if (miner && overlap(p, miner)) { rescueMiner(); return; }

  updateRoom(false);
}

function fireLaser(dt) {
  const p = player, dir = p.facing, y = p.y + 5;
  const x0 = dir > 0 ? p.x + PW : p.x;
  let len = 0;
  // March the beam forward 2px at a time until it hits something solid.
  for (; len < LASER_LEN; len += 2) {
    const x = x0 + dir * len, c = Math.floor(x / TILE), r = Math.floor(y / TILE), t = tileAt(c, r);
    if (isSolid(t)) { if (t === 'W') damageWall(c, r, dt, x, y); else if (ORE[t]) damageOre(c, r, dt, x, y); break; }
  }
  p.beamEnd = x0 + dir * len;
  const beam = { x: Math.min(x0, p.beamEnd), y: y - 1, w: Math.max(1, len), h: 3 };
  for (const e of enemies) if (e.alive && overlap(beam, e)) killEnemy(e);
}

function damageWall(c, r, dt, sx, sy) {
  const k = c + ',' + r;
  const hp = (level.wallHp.has(k) ? level.wallHp.get(k) : WALL_LASER_TIME) - dt;
  if (Math.random() < 0.5) addP({ type: 'spark', x: sx, y: sy, vx: rnd(-70, 70) - player.facing * 40, vy: rnd(-90, 10), life: rnd(0.15, 0.4), color: Math.random() < 0.5 ? '#fff080' : '#ff9040', size: 1 });
  if (Math.random() < 0.06) addP({ type: 'smoke', x: sx, y: sy, vx: rnd(-10, 10), vy: rnd(-20, -5), life: rnd(0.6, 1.1), size: 2, grow: 8 });
  if (hp <= 0) destroyWall(c, r); else level.wallHp.set(k, hp);
}

function damageOre(c, r, dt, sx, sy) {
  const k = c + ',' + r, ore = ORE[tileAt(c, r)];
  const hp = (level.wallHp.has(k) ? level.wallHp.get(k) : ore.laserTime) - dt;
  if (Math.random() < 0.5) addP({ type: 'spark', x: sx, y: sy, vx: rnd(-70, 70) - player.facing * 40, vy: rnd(-90, 10), life: rnd(0.15, 0.4), color: Math.random() < 0.5 ? ore.light : ore.color, size: 1 });
  if (hp <= 0) mineOre(c, r); else level.wallHp.set(k, hp);
}

// Crack an ore vein open: the tile turns back into plain rock and nuggets fly out
// of whichever side faces open space.
function mineOre(c, r, ox, oy) {
  const kind = tileAt(c, r), ore = ORE[kind]; if (!ore) return;
  level.tiles[r][c] = '#'; level.wallHp.delete(c + ',' + r); mapVersion++;
  const sides = [[0, -1], [-1, 0], [1, 0], [0, 1]].filter(([dc, dr]) => !isSolid(tileAt(c + dc, r + dr)));
  if (ox !== undefined) sides.sort((a, b) =>      // prefer the side facing away from a blast
    Math.hypot(c * TILE + 8 + b[0] * 16 - ox, r * TILE + 8 + b[1] * 16 - oy) - Math.hypot(c * TILE + 8 + a[0] * 16 - ox, r * TILE + 8 + a[1] * 16 - oy));
  const [dc, dr] = sides[0] || [0, -1];
  const ex = c * TILE + 8 + dc * 11, ey = r * TILE + 8 + dr * 11;   // just outside the exposed face
  for (let i = 0; i < ore.nuggets; i++) {
    // Start each nugget fully inside the open tile next to the exposed face.
    const x = dc > 0 ? (c + 1) * TILE + rnd(0.5, 4) : dc < 0 ? c * TILE - 5.5 - rnd(0, 3.5) : c * TILE + rnd(1, 10);
    const y = dr < 0 ? r * TILE - 4.5 - rnd(0, 3) : dr > 0 ? (r + 1) * TILE + rnd(0.5, 3) : r * TILE + rnd(2, 10);
    const n = { kind, x, y, w: 5, h: 4, age: 0,
                vx: dc * rnd(40, 100) + rnd(-35, 35), vy: (dr ? dr * rnd(40, 90) : 0) - rnd(60, 130),
                life: NUGGET_LIFE, spin: rnd(6) };
    if (!rectHitsSolid(n.x, n.y, n.w, n.h)) nuggets.push(n);
  }
  burst(ex, ey, ore.light, 10); burst(ex, ey, ore.color, 8);
  debris(ex, ey, level.def.rock, 4);
  addP({ type: 'light', x: ex, y: ey, life: 0.3, size: 30 });
  tone(kind === 'g' ? 1500 : 900, 0.12, 'triangle', 0.06, kind === 'g' ? 2400 : 1300);
}

function updateNuggets(dt) {
  const p = player;
  for (const n of nuggets) {
    n.life -= dt; n.age += dt; n.spin += dt * 4;
    n.vy = Math.min(n.vy + 480 * dt, 200);
    if (moveX(n, n.vx * dt)) n.vx *= -0.5;
    n.onGround = false;
    if (moveY(n, n.vy * dt)) {
      if (n.vy > 0) { n.onGround = true; n.vy = Math.abs(n.vy) > 40 ? -n.vy * 0.35 : 0; if (Math.abs(n.vy) > 5) tone(2200, 0.02, 'square', 0.015); }
      else n.vy = 0;
    }
    if (n.onGround) n.vx *= Math.pow(0.02, dt);      // friction
    if (touchesTile(n, 'L')) { n.life = 0; burst(n.x + 2, n.y, '#ff8040', 5); continue; }
    if (n.age > 0.35 && overlap({ x: p.x - 2, y: p.y - 2, w: p.w + 4, h: p.h + 4 }, n)) {   // collected!
      const ore = ORE[n.kind]; n.life = 0; money += ore.value;
      addP({ type: 'text', x: n.x + 2, y: n.y - 4, vy: -22, life: 0.9, text: '+$' + ore.value, color: ore.light });
      burst(n.x + 2, n.y + 1, ore.light, 6, 40);
      tone(n.kind === 'g' ? 1320 : 990, 0.06, 'square', 0.05); tone(n.kind === 'g' ? 1980 : 1320, 0.12, 'square', 0.05, 0, 0.06);
    }
  }
  nuggets = nuggets.filter(n => n.life > 0);
}

// Destroy the whole connected breakable wall (flood fill), not just one tile.
function destroyWall(c, r, ox, oy) {   // (ox, oy) = where the blast came from, if any
  const stack = [[c, r]]; let n = 0;
  while (stack.length) {
    const [cc, rr] = stack.pop();
    if (tileAt(cc, rr) !== 'W') continue;
    level.tiles[rr][cc] = '.'; level.wallHp.delete(cc + ',' + rr); n++;
    const x = cc * TILE + 8, y = rr * TILE + 8;
    debris(x, y, level.def.wall, 7, ox, oy);
    smokePuffs(x, y, 2, 6);
    burst(x, y, level.def.wall, 3);
    stack.push([cc + 1, rr], [cc - 1, rr], [cc, rr + 1], [cc, rr - 1]);
  }
  if (n) { addScore(PTS_WALL); if (!blasting) noiseBurst(0.35, 0.18); shake = Math.max(shake, 0.25); mapVersion++; }
}

function fuseTip() {   // where the burning end of the fuse is right now
  const len = 1 + 5 * Math.max(0, dynamite.fuse) / FUSE;
  return { x: dynamite.x + 2 + len * 0.35, y: dynamite.y - len };
}
function explode() {
  const cx = dynamite.x + 2, cy = dynamite.y + 4;
  dynamite = null;
  if (!playSample(boomBuffer, sampleGain('explosion'), rnd(0.94, 1.04)))   // recorded blast...
    { noiseBurst(0.9, 0.45); tone(90, 0.6, 'sawtooth', 0.12, 30); }   // ...or the synth one if it isn't loaded
  blasting = true;                     // walls broken by this blast stay quiet – the recording covers it
  spawnExplosion(cx, cy);
  const c0 = Math.floor((cx - BLAST_RADIUS) / TILE), c1 = Math.floor((cx + BLAST_RADIUS) / TILE);
  const r0 = Math.floor((cy - BLAST_RADIUS) / TILE), r1 = Math.floor((cy + BLAST_RADIUS) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
    if (tileAt(c, r) === 'W' && Math.hypot(c * TILE + 8 - cx, r * TILE + 8 - cy) <= BLAST_RADIUS) destroyWall(c, r, cx, cy);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
    if (ORE[tileAt(c, r)] && Math.hypot(c * TILE + 8 - cx, r * TILE + 8 - cy) <= BLAST_RADIUS) mineOre(c, r, cx, cy);
  for (const n of nuggets) { const d = Math.hypot(n.x - cx, n.y - cy) || 1; if (d < BLAST_RADIUS) { n.vx += (n.x - cx) / d * 120; n.vy -= 120; } }
  for (const e of enemies) if (e.alive) { const ec = center(e); if (Math.hypot(ec.x - cx, ec.y - cy) < BLAST_RADIUS + 6) killEnemy(e); }
  blasting = false;
  const pc = center(player);
  if (Math.hypot(pc.x - cx, pc.y - cy) < BLAST_SELF) killPlayer();
}

function updateEnemy(e, dt) {
  e.t += dt;
  if (e.type === 'bat') {               // flies left/right, bobbing, turns at walls
    const nx = e.x + e.vx * dt;
    if (rectHitsSolid(nx, e.baseY - 4, e.w, e.h + 8)) e.vx = -e.vx; else e.x = nx;
    e.y = e.baseY + Math.sin(e.t * 5) * 4;
  } else if (e.type === 'spider') {     // rides its thread up and down
    e.y += e.dir * e.speed * dt;
    if (e.y > e.bottom) { e.y = e.bottom; e.dir = -1; }
    if (e.y < e.top)    { e.y = e.top;    e.dir = 1; }
  } else if (e.type === 'moth') {       // flutters in a figure-of-eight
    e.x = e.homeX + Math.sin(e.t * 1.6) * 22;
    e.y = e.homeY + Math.sin(e.t * 2.7) * 10;
  }
}

function killEnemy(e) {
  e.alive = false; addScore(PTS_ENEMY);
  const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
  burst(ex, ey, '#ffffff', 10); burst(ex, ey, '#ff70ff', 6);
  addP({ type: 'fire', x: ex, y: ey, life: 0.25, size: 3, grow: 30 });
  addP({ type: 'light', x: ex, y: ey, life: 0.25, size: 40 });
  smokePuffs(ex, ey, 3, 3);
  tone(1200, 0.15, 'square', 0.05, 200);
}

function killPlayer() {
  if (state !== 'playing') return;
  state = 'dying'; stateTimer = 1.6; player.firing = false; dynamite = null;
  noiseBurst(0.4, 0.2); tone(500, 0.9, 'square', 0.07, 50);
  const pc = center(player); shake = Math.max(shake, 0.3);
  burst(pc.x, pc.y, '#ffe060', 14); burst(pc.x, pc.y, '#ff4020', 10); smokePuffs(pc.x, pc.y, 5, 5);
}
function updateDying(dt) {
  stateTimer -= dt;
  if (stateTimer > 0) return;
  if (lives === 0) { state = 'gameover'; stateTimer = 1; saveHi(); return; }
  lives--;
  power = 100; dynamiteLeft = DYNAMITE_PER_LIFE;
  spawnPlayer(checkpoint);
  state = 'playing';
}

function rescueMiner() {
  state = 'levelDone'; stateTimer = 1.5; tallyAcc = 0; tickT = 0.8;
  player.firing = false; dynamite = null;
  addScore(PTS_MINER);
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.06, 0, i * 0.12));
}
// Count the leftover power and dynamite into the score, like the original.
function updateLevelDone(dt) {
  if (tickT > 0 && power === 100 && tallyAcc === 0) { tickT -= dt; return; } // short pause first
  if (power > 0) {
    const d = Math.min(power, 70 * dt); power -= d;
    tallyAcc += d * 15; const whole = Math.floor(tallyAcc); if (whole) { addScore(whole); tallyAcc -= whole; }
    tickT -= dt; if (tickT <= 0) { tone(1400, 0.03, 'square', 0.03); tickT = 0.05; }
    if (power <= 0) { power = 0; tickT = 0.3; }
  } else if (dynamiteLeft > 0) {
    tickT -= dt;
    if (tickT <= 0) { dynamiteLeft--; addScore(PTS_DYNAMITE_BONUS); tone(600, 0.08, 'square', 0.05); tickT = 0.25; }
  } else {
    stateTimer -= dt;
    if (stateTimer <= 0) {
      levelIndex++;
      if (levelIndex >= LEVELS.length) { state = 'win'; stateTimer = 1; saveHi(); }
      else beginLevel();
    }
  }
}

function saveHi() {
  if (score > hiScore) { hiScore = score; try { localStorage.setItem('propPackHi', hiScore); } catch (e) {} }
}

const pointSolid = (x, y) => isSolid(tileAt(Math.floor(x / TILE), Math.floor(y / TILE)));
function updateParticles(dt) {
  for (const q of particles) {
    if (q.delay > 0) { q.delay -= dt; continue; }
    q.life -= dt;
    switch (q.type) {
      case 'debris': {                       // gravity + bounce off rock
        q.vy += 430 * dt; q.rot += q.vr * dt;
        const nx = q.x + q.vx * dt;
        if (pointSolid(nx, q.y)) { q.vx *= -0.4; q.vr *= 0.5; } else q.x = nx;
        const ny = q.y + q.vy * dt;
        if (pointSolid(q.x, ny)) { if (q.vy > 0) { q.vx *= 0.6; q.vr *= 0.6; } q.vy *= -0.35; } else q.y = ny;
        break;
      }
      case 'spark': case 'ember': {
        q.vy += (q.type === 'ember' ? 70 : 320) * dt;
        const drag = 1 - (q.type === 'ember' ? 1.2 : 0.8) * dt; q.vx *= drag; q.vy *= drag;
        q.x += q.vx * dt; q.y += q.vy * dt;
        if (q.type === 'ember' && pointSolid(q.x, q.y)) q.life = Math.min(q.life, 0.1);
        break;
      }
      case 'fire': case 'smoke': case 'dust': {
        const drag = 1 - (q.type === 'fire' ? 3.5 : 1.4) * dt; q.vx *= drag; q.vy *= drag;
        q.vy -= (q.type === 'dust' ? 0 : q.type === 'fire' ? 30 : 16) * dt;   // hot stuff rises
        q.x += q.vx * dt; q.y += q.vy * dt; q.size += q.grow * dt;
        break;
      }
      case 'ring': q.size += q.grow * dt; break;
      case 'text': q.y += q.vy * dt; break;
    }
  }
  particles = particles.filter(q => q.life > 0);
}

function step(dt) {
  globalT += dt;
  if (pressed.mute) muted = !muted;
  if (pressed.gfx) { HD = !HD; applyGfxMode(); }
  if (pressed.tex) TEX.on = !TEX.on;
  if (state === 'title') {
    if (pressed.start || pressed.fire) startGame();
  } else if (state === 'playing') {
    if (pressed.pause) paused = !paused;
    if (!paused) updatePlaying(dt);
  } else if (state === 'dying') {
    updateDying(dt);
  } else if (state === 'levelDone') {
    updateLevelDone(dt);
  } else if (state === 'gameover' || state === 'win') {
    stateTimer -= dt;
    if (stateTimer <= 0 && (pressed.start || pressed.fire)) state = 'title';
  }
  if (!paused) { updateParticles(dt); if (flash > 0) flash -= dt; if (shake > 0) shake = Math.max(0, shake - dt * 1.6); }
  for (const k in pressed) delete pressed[k];
}

// ---------------------------------------------------------------------
// 6. DRAWING – CLASSIC mode (everything is filled rectangles – very Atari)
// ---------------------------------------------------------------------
function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function text(str, x, y, color = '#fff', size = 8, align = 'left') {
  ctx.font = `bold ${size}px monospace`; ctx.textBaseline = 'top'; ctx.textAlign = align;
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawTiles() {
  const d = level.def;
  const c0 = roomX * ROOM_COLS, r0 = roomY * ROOM_ROWS;
  for (let r = r0; r < r0 + ROOM_ROWS; r++) for (let c = c0; c < c0 + ROOM_COLS; c++) {
    const t = tileAt(c, r), x = c * TILE, y = r * TILE;
    if (t === '#' && !lightsOut) {
      rect(x, y, TILE, TILE, d.rock);
      rect(x, y + ((r % 2) ? 4 : 11), TILE, 2, d.dark);        // horizontal rock bands
      if (!isSolid(tileAt(c, r - 1))) rect(x, y, TILE, 2, d.light); // lit top edge
    } else if (t === 'W' && !lightsOut) {
      rect(x, y, TILE, TILE, d.wall);
      rect(x, y + 7, TILE, 2, d.dark);
      rect(x + ((r % 2) ? 4 : 11), y, 2, 7, d.dark);
      rect(x + ((r % 2) ? 11 : 4), y + 9, 2, 7, d.dark);
      const hp = level.wallHp.get(c + ',' + r);
      if (hp !== undefined) { ctx.globalAlpha = 1 - hp / WALL_LASER_TIME; rect(x, y, TILE, TILE, '#ff3000'); ctx.globalAlpha = 1; }
    } else if (ORE[t] && !lightsOut) {   // rock with coloured flecks that twinkle
      const ore = ORE[t];
      rect(x, y, TILE, TILE, d.rock);
      rect(x, y + ((r % 2) ? 4 : 11), TILE, 2, d.dark);
      for (let i = 0; i < 7; i++) {
        const fx = x + 1 + Math.floor(hash(c, r, i) * 12), fy = y + 1 + Math.floor(hash(c, r, i + 9) * 13);
        const tw = ((globalT * 1.5 + hash(c, r, i + 20)) % 1) < 0.08;
        rect(fx, fy, 3, 2, tw ? '#ffffff' : (i % 3 ? ore.color : ore.light));
      }
      const hp = level.wallHp.get(c + ',' + r);
      if (hp !== undefined) { ctx.globalAlpha = 1 - hp / ore.laserTime; rect(x, y, TILE, TILE, '#ff3000'); ctx.globalAlpha = 1; }
    } else if (t === 'L') {   // lava glows, so you can see it even in the dark
      const f = Math.sin(globalT * 7 + c * 1.3 + r * 0.7);
      rect(x, y, TILE, TILE, f > 0 ? '#ff4a10' : '#d82800');
      rect(x + (c * 5 + r * 3 + Math.floor(globalT * 4)) % 13, y + (r * 7 + c) % 12, 3, 3, '#ffc030');
    }
  }
}

function drawHero(x, y, f, spinning, inAir, walkPhase) {
  x = Math.round(x); y = Math.round(y);
  // rotor
  rect(x + 4, y - 3, 2, 3, '#c8c8c8');
  const blade = spinning ? (Math.floor(globalT * 30) % 2 ? 14 : 4) : 12;
  rect(x + 5 - blade / 2, y - 4, blade, 1, '#e8e8e8');
  // helmet + lamp (the laser comes out of the lamp)
  rect(x + 1, y, 8, 5, '#f0d030');
  rect(f > 0 ? x + 8 : x, y + 3, 2, 2, '#ffffff');
  // face
  rect(f > 0 ? x + 4 : x + 1, y + 5, 5, 3, '#f0b080');
  // body, backpack, arm
  rect(x + 2, y + 8, 6, 8, '#d04020');
  rect(f > 0 ? x : x + 7, y + 8, 3, 7, '#909090');
  rect(f > 0 ? x + 6 : x + 1, y + 10, 3, 2, '#f0b080');
  // legs
  if (inAir) { rect(x + 2, y + 16, 6, 4, '#3050c0'); rect(x + 2, y + 19, 6, 2, '#603010'); }
  else if (walkPhase) { rect(x + 1, y + 16, 2, 6, '#3050c0'); rect(x + 6, y + 16, 2, 4, '#3050c0'); rect(x + 6, y + 19, 3, 2, '#603010'); rect(x, y + 20, 3, 2, '#603010'); }
  else { rect(x + 2, y + 16, 2, 6, '#3050c0'); rect(x + 6, y + 16, 2, 6, '#3050c0'); rect(x + 2, y + 20, 3, 2, '#603010'); rect(x + 6, y + 20, 3, 2, '#603010'); }
}

// Split the beam into dashes that scroll away from the helmet.
// (Only the drawing is dashed – the laser still hits along its whole length.)
// A quick repeating flicker (1 = brightest) that makes the beam shimmer while firing.
function laserPulse() { const k = 1 - ((player.fireT || 0) % LASER_PULSE) / LASER_PULSE; return k * k; }
function laserSegments() {
  const p = player, dir = p.facing, x0 = dir > 0 ? p.x + PW : p.x;
  const len = Math.abs(p.beamEnd - x0), period = LASER_DASH + LASER_GAP;
  const offset = (globalT * LASER_SCROLL) % period, segs = [];
  for (let d = offset - period; d < len; d += period) {
    const a = Math.max(0, d), b = Math.min(len, d + LASER_DASH);
    if (b > a) segs.push([x0 + dir * a, x0 + dir * b]);
  }
  return segs;
}

function drawPlayer() {
  const p = player;
  if (state === 'dying' && Math.floor(globalT * 12) % 2) return;
  if (state === 'playing' && p.invuln > 0 && Math.floor(globalT * 20) % 2) return;
  const walking = p.onGround && Math.abs(p.vx) > 5 ? Math.floor(p.walkT * 10) % 2 : 0;
  drawHero(p.x, p.y, p.facing, p.spin > 0 || !p.onGround, !p.onGround, walking);
  if (p.firing && state === 'playing') {
    const col = laserPulse() > 0.35 ? '#ffffff' : '#ff50ff';   // flickers white/magenta
    for (const [a, b] of laserSegments()) rect(Math.min(a, b), p.y + 4, Math.max(1, Math.round(Math.abs(b - a))), 2, col);
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const x = Math.round(e.x), y = Math.round(e.y), flap = Math.floor(e.t * 10) % 2;
    if (e.type === 'bat') {
      rect(x + 5, y + 2, 4, 4, '#b050d0');
      rect(x + 6, y + 3, 1, 1, '#ff2020'); rect(x + 8, y + 3, 1, 1, '#ff2020');
      if (flap) { rect(x, y, 5, 2, '#b050d0'); rect(x + 9, y, 5, 2, '#b050d0'); }
      else      { rect(x, y + 5, 5, 2, '#b050d0'); rect(x + 9, y + 5, 5, 2, '#b050d0'); }
    } else if (e.type === 'spider') {
      rect(x + 6, e.threadTop, 1, y - e.threadTop + 2, '#c0c0c0');
      rect(x + 3, y + 2, 7, 6, '#40d040');
      rect(x + 4, y + 3, 1, 1, '#000'); rect(x + 8, y + 3, 1, 1, '#000');
      const l = flap ? 1 : 0;
      for (let i = 0; i < 3; i++) { rect(x, y + 2 + i * 2 + l, 3, 1, '#40d040'); rect(x + 10, y + 2 + i * 2 + (1 - l), 3, 1, '#40d040'); }
    } else if (e.type === 'moth') {
      rect(x + 4, y + 2, 2, 5, '#806040');
      if (flap) { rect(x, y, 4, 5, '#e0e890'); rect(x + 6, y, 4, 5, '#e0e890'); }
      else      { rect(x + 1, y + 2, 3, 3, '#e0e890'); rect(x + 6, y + 2, 3, 3, '#e0e890'); }
    }
  }
}

function drawLanterns() {
  for (const l of lanterns) {
    rect(l.x + 3, l.y, 2, 3, '#888');
    rect(l.x, l.y + 3, 8, 8, l.lit ? '#ffe060' : '#505050');
    rect(l.x + 2, l.y + 5, 4, 4, l.lit ? '#fff8c0' : '#303030');
  }
}

// The trapped miner sits slumped on the floor, filthy from the collapse. He turns to
// face the hero, waves and calls for help when you get near (or every few seconds),
// and now and then coughs up a little dust.
function minerMood() {
  const mcx = miner.x + 6, pcx = player ? player.x + PW / 2 : mcx - 100;
  const near = player && Math.abs(pcx - mcx) < 110 && Math.abs(player.y - miner.y) < 60;
  const waving = near || (globalT % 5) < 1.6;
  return { f: pcx < mcx ? -1 : 1, waving, wave: Math.sin(globalT * 9), breathe: Math.sin(globalT * 2.2) * 0.35,
           cough: (globalT % 4.3) < 0.35 };
}
function drawMiner() {
  if (!miner) return;
  const x = Math.round(miner.x), y = Math.round(miner.y), m = minerMood(), f = m.f;
  const R = (dx, dy, w, h, col) => rect(f > 0 ? x + dx : x + 12 - dx - w, y + dy, w, h, col);
  R(1, 7, 7, 4, '#8a8a84');                                  // scuffed helmet
  R(3, 7, 2, 1, '#5a5a56');                                  // dent
  R(2, 11, 6, 3, '#c89870');                                 // grimy face
  R(5, 12, 2, 1, '#6a4a30');                                 // dirt smudge
  R(1, 14, 7, 5, '#3a5684');                                 // dusty overalls
  R(2, 15, 2, 2, '#5a4a38'); R(5, 17, 2, 1, '#5a4a38');      // grime patches
  R(6, 16, 5, 2, '#3a5684');                                 // thigh (knees up)
  R(9, 18, 3, 2, '#4a2a12');                                 // boot
  if (m.waving) R(m.wave > 0 ? 7 : 6, m.wave > 0 ? 6 : 8, 2, 6, '#c89870');   // waving arm
  else R(6, 14, 4, 2, '#3a5684');                            // arm resting on knee
}

function drawDynamite() {
  if (!dynamite) return;
  rect(dynamite.x, dynamite.y, 4, 9, '#e02020');
  rect(dynamite.x + 1, dynamite.y - 2, 1, 2, '#ccc');
  if (Math.floor(globalT * 20) % 2) rect(dynamite.x, dynamite.y - 4, 3, 2, '#ffff60');
}

function drawNuggets() {
  for (const n of nuggets) {
    if (n.life < 3 && Math.floor(globalT * 8) % 2) continue;      // blink before vanishing
    const ore = ORE[n.kind];
    rect(n.x, n.y, 5, 4, ore.color); rect(n.x, n.y, 3, 2, ore.light); rect(n.x + 3, n.y + 3, 2, 1, ore.dark);
  }
}
function drawTextParticles() {
  for (const q of particles) if (q.type === 'text') {
    ctx.globalAlpha = Math.min(1, q.life / q.max * 2);
    text(q.text, q.x, q.y, q.color, 7, 'center'); ctx.globalAlpha = 1;
  }
}
function drawParticles() {   // classic: everything is a 2x2 pixel, no smoke/rings/lights
  for (const q of particles) {
    if (q.delay > 0) continue;
    if (q.type === 'spark' || q.type === 'ember' || q.type === 'debris') rect(q.x, q.y, 2, 2, q.color);
    else if (q.type === 'fire' && q.life / q.max > 0.4) rect(q.x - 1, q.y - 1, 3, 3, q.life / q.max > 0.7 ? '#ffffa0' : '#ff9020');
  }
}

function drawHUD() {
  const y = VIEW_H;
  rect(0, y, SCREEN_W, SCREEN_H - y, '#181818');
  // power bar
  text('POWER', 4, y + 3, '#aaa');
  rect(36, y + 3, 102, 7, '#333');
  rect(37, y + 4, Math.max(0, power), 5, power > 30 ? '#40e040' : (Math.floor(globalT * 6) % 2 ? '#ff4040' : '#802020'));
  text('LEVEL ' + (levelIndex + 1), 316, y + 3, '#aaa', 8, 'right');
  // spare lives (little helmets) and dynamite sticks
  for (let i = 0; i < Math.min(lives, 8); i++) { rect(4 + i * 9, y + 15, 7, 4, '#f0d030'); rect(5 + i * 9, y + 19, 5, 3, '#d04020'); }
  for (let i = 0; i < dynamiteLeft; i++) rect(90 + i * 6, y + 14, 3, 8, '#e02020');
  text('$' + money, 140, y + 14, '#ffd23a', 8);

}

function drawTitle() {
  rect(0, 0, SCREEN_W, SCREEN_H, '#000');
  for (let i = 0; i < 20; i++) rect(i * 16, 168, 16, 16, i % 2 ? '#b86a2c' : '#a05a20');
  text('PROP-PACK', 160, 22, '#f0d030', 20, 'center');

  const bob = Math.sin(globalT * 3) * 6;

  text('Watch your POWER. Mind the lava. Don\'t blow yourself up.', 160, 137, '#ccc', 8, 'center');
  if (Math.floor(globalT * 2) % 2) text('CLICK OR PRESS ENTER TO START', 160, 152, '#fff', 8, 'center');
  text('HI ' + String(hiScore).padStart(6, '0'), 160, 188, '#f0d030', 8, 'center');
}

function centerBanner(lines) {
  const h = lines.length * 12 + 10, y = (VIEW_H - h) / 2;
  ctx.globalAlpha = 0.8; rect(40, y, 240, h, '#000'); ctx.globalAlpha = 1;

// 6b. ENHANCED (HD) RENDERER

function updateDecorations(dt) {
  if (!level.deco) return;
  const p = player;
  for (const d of level.deco) if (d.type === 'puddle') {
    // drips fall from the ceiling above every few seconds
    d.nextDrip -= dt;
    if (d.nextDrip <= 0) {
      d.nextDrip = rnd(2.5, 7);

    }

    } else {

    g.fillStyle = gr; g.fillRect(x, y, TILE, TILE);

    g.fillStyle = 'rgba(90,15,0,0.45)';
    for (let i = 0; i < 3; i++) {
      const cx = x + ((hash(c, r, i) * 22 + globalT * (3 + i * 2)) % 22) - 3, cy = y + 3 + hash(c, r, i + 5) * 10;

    }

function drawWallDamageHD(g) {

function drawOreSparkleHD(g) {   // twinkling star glints on ore veins
  const c0 = roomX * ROOM_COLS, r0 = roomY * ROOM_ROWS;
  g.globalCompositeOperation = 'lighter';
  for (let r = r0; r < r0 + ROOM_ROWS; r++) for (let c = c0; c < c0 + ROOM_COLS; c++) {
    const ore = ORE[tileAt(c, r)]; if (!ore) continue;
    if (ore.name === 'gold') glow(g, c * TILE + 8, r * TILE + 8, 12, 'rgba(255,200,60,0.10)');
    for (let i = 0; i < 2; i++) {
      const ph = (globalT * 0.6 + hash(c, r, i + 600)) % 1;
      if (ph > 0.18) continue;
      const k = Math.sin(ph / 0.18 * Math.PI), sx = c * TILE + 2 + hash(c, r, i + 610 + Math.floor(globalT * 0.6)) * 12, sy = r * TILE + 2 + hash(c, r, i + 620 + Math.floor(globalT * 0.6)) * 12;
      g.strokeStyle = `rgba(255,255,230,${k})`; g.lineWidth = 0.45;
      g.beginPath(); g.moveTo(sx - 3 * k, sy); g.lineTo(sx + 3 * k, sy); g.moveTo(sx, sy - 3 * k); g.lineTo(sx, sy + 3 * k); g.stroke();
      glow(g, sx, sy, 2.5 * k + 0.5, `rgba(255,240,180,${0.8 * k})`);

  g.globalCompositeOperation = 'source-over';
}

function drawNuggetsHD(g) {

    gr.addColorStop(0, ore.light); gr.addColorStop(0.5, ore.color); gr.addColorStop(1, ore.dark);
    g.fillStyle = gr; g.beginPath();

  // arm: straight out when firing the laser, swinging otherwise

  if (o.firing) { rr(g, 0.4, -13.8, 5.2, 2.3, 1); g.fill(); g.fillStyle = '#f2b98c'; g.beginPath(); g.arc(5.8, -12.65, 1.15, 0, Math.PI * 2); g.fill(); }
  else {

  g.fillStyle = '#b88a0c'; rr(g, -3.7, -19, 8.9, 1.15, 0.5); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.65)'; g.beginPath(); g.ellipse(-0.7, -21.3, 1.4, 0.6, -0.4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fffbe0'; g.beginPath(); g.arc(4.5, -19.9, 0.95, 0, Math.PI * 2); g.fill();

  g.fillStyle = '#d0d0d0'; g.beginPath(); g.arc(-1.2, -24.6, 0.8, 0, Math.PI * 2); g.fill();

function lampPos() { const p = player; return { x: p.x + PW / 2 + p.facing * 4.5, y: p.y + PH - 19.9 }; }

function drawPlayerHD(g) {
  const p = player;
  const hidden = (state === 'dying' && Math.floor(globalT * 12) % 2) ||
                 (state === 'playing' && p.invuln > 0 && Math.floor(globalT * 20) % 2);
  const inAir = !p.onGround;
  const lean = Math.max(-1, Math.min(1, p.vx * p.facing / PHYS.maxSpeed)) * (inAir ? 0.16 : 0.05);
  const spin = Math.max(Math.min(1, p.spin / Math.max(0.01, PHYS.spinUp)), inAir ? 0.35 : 0);
  const firing = p.firing && state === 'playing';
  if (!hidden) drawHeroHD(g, p.x, p.y, p.facing, { spin, inAir, walkT: p.walkT, vx: p.vx, firing, lean });
  if (firing) {   // glowing segmented beam: each dash drawn in three passes, wide/soft to thin/hot
    const x1 = p.beamEnd, y = p.y + 5 + Math.sin(globalT * 90) * 0.25, segs = laserSegments();
    const pulse = 0.8 + 0.45 * laserPulse();   // beam shimmers while firing
    g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for (const [w, c] of [[3.4, 'rgba(255,50,210,0.25)'], [1.8, 'rgba(255,120,255,0.65)'], [0.7, 'rgba(255,255,255,0.95)']]) {
      g.strokeStyle = c; g.lineWidth = w * pulse * rnd(0.9, 1.1);
      g.beginPath();
      for (const [a, b] of segs) { g.moveTo(a, y); g.lineTo(b, y); }
      g.stroke();
    }
    glow(g, x1, y, 4 + 3 * laserPulse(), 'rgba(255,200,255,0.8)');
    g.globalCompositeOperation = 'source-over'; g.lineCap = 'butt';
  }
}

function drawEnemiesHD(g) {
  for (const e of enemies) {
    if (!e.alive) continue;
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    if (e.type === 'bat') {
      const a = Math.sin(e.t * 18);
      g.save(); g.translate(cx, cy);
      g.fillStyle = '#4a2266';
      for (const s of [-1, 1]) {   // membrane wings with scalloped edges
        g.beginPath(); g.moveTo(0, -0.5);
        g.quadraticCurveTo(s * 4, -3 - 3 * a, s * 8, -2 - 4 * a);
        g.quadraticCurveTo(s * 7, 0.5 - a, s * 5.8, 0.6);
        g.quadraticCurveTo(s * 4.8, 2.4, s * 3.2, 1);
        g.quadraticCurveTo(s * 2, 2.6, 0, 1.6); g.closePath(); g.fill();
      }
      const bg = g.createRadialGradient(-0.5, -0.8, 0.2, 0, 0, 3);
      bg.addColorStop(0, '#9a5ac4'); bg.addColorStop(1, '#3e1a58');
      g.fillStyle = bg; g.beginPath(); g.ellipse(0, 0.3, 2.3, 2.8, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3e1a58';
      g.beginPath(); g.moveTo(-1.8, -1.6); g.lineTo(-1.2, -3.8); g.lineTo(-0.4, -2); g.fill();
      g.beginPath(); g.moveTo(1.8, -1.6); g.lineTo(1.2, -3.8); g.lineTo(0.4, -2); g.fill();
      g.globalCompositeOperation = 'lighter';
      glow(g, -0.9, -0.4, 1.6, 'rgba(255,40,40,0.9)'); glow(g, 0.9, -0.4, 1.6, 'rgba(255,40,40,0.9)');
      g.globalCompositeOperation = 'source-over';
      g.restore();
    } else if (e.type === 'spider') {
      g.strokeStyle = 'rgba(230,230,230,0.5)'; g.lineWidth = 0.4;
      g.beginPath(); g.moveTo(cx, e.threadTop); g.lineTo(cx, cy - 2); g.stroke();
      g.strokeStyle = '#1c5e22'; g.lineWidth = 0.8;
      for (const s of [-1, 1]) for (let i = 0; i < 4; i++) {
        const w = Math.sin(e.t * 12 + i * 1.3 + (s > 0 ? 1 : 0)) * 0.9;
        g.beginPath(); g.moveTo(cx + s * 1.5, cy + 0.5);
        g.quadraticCurveTo(cx + s * (4 + i * 0.5), cy - 3.5 + i * 1.3 + w, cx + s * (6.2 + i * 0.3), cy + 1 + i * 1.5 + w * 0.5);
        g.stroke();
      }

      ab.addColorStop(0, '#7af07e'); ab.addColorStop(1, '#17561c');
      g.fillStyle = ab; g.beginPath(); g.arc(cx, cy - 0.6, 3.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#1f6a24'; g.beginPath(); g.arc(cx, cy + 2.6, 2.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ff3030';
      for (const ox of [-1, -0.35, 0.35, 1]) g.fillRect(cx + ox - 0.25, cy + 2.6, 0.5, 0.5);
    } else if (e.type === 'moth') {
      const f = 0.3 + 0.7 * Math.abs(Math.sin(e.t * 16));

      g.globalCompositeOperation = 'lighter'; glow(g, 0, 0, 8, 'rgba(230,240,160,0.18)'); g.globalCompositeOperation = 'source-over';
      g.fillStyle = 'rgba(236,232,170,0.88)';
      for (const s of [-1, 1]) {
        g.beginPath(); g.ellipse(s * 2.6, -0.8, 2.6, 2.4 * f, s * 0.5, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(s * 2, 1.6, 1.8, 1.6 * f, -s * 0.4, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = 'rgba(120,90,50,0.6)';
      for (const s of [-1, 1]) { g.beginPath(); g.arc(s * 2.8, -0.8, 0.7 * f + 0.2, 0, Math.PI * 2); g.fill(); }
      g.fillStyle = '#7a5a34'; g.beginPath(); g.ellipse(0, 0.3, 0.9, 2.8, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#7a5a34'; g.lineWidth = 0.3;
      g.beginPath(); g.moveTo(-0.3, -2.4); g.lineTo(-1.6, -4.2); g.moveTo(0.3, -2.4); g.lineTo(1.6, -4.2); g.stroke();
      g.restore();
    }
  }
}

  dirt(-1.6, -2.4, 0.9, 0.5);
  g.fillStyle = '#3a3a36'; g.beginPath(); g.arc(3.2, -2, 0.75, 0, Math.PI * 2); g.fill();   // dead lamp
  g.restore();
  g.restore();
  g.restore();
  // a little puff of dust when he coughs
  if (m.cough && Math.random() < 0.25 && state === 'playing')
    addP({ type: 'dust', x: bx + f * 3.5, y: by - 14, vx: f * rnd(8, 20), vy: rnd(-6, 2), life: rnd(0.5, 0.8), size: 1, grow: 5 });

function fireColor(k) {   // k = how far through its life a fire puff is (0 = new, 1 = dead)
  if (k < 0.12) return [255, 250, 220];
  if (k < 0.3) return [255, 210, 80];
  if (k < 0.55) return [255, 120, 30];
  return [170, 40, 15];
}
function drawParticlesHD(g) {
  // pass 1: things that block light (smoke, dust, debris)
  for (const q of particles) {
    if (q.delay > 0) continue;
    const k = q.life / q.max;
    if (q.type === 'smoke' || q.type === 'dust') {
      const fadeIn = Math.min(1, (q.max - q.life) / 0.15);
      const a = (q.type === 'smoke' ? 0.62 : 0.3) * Math.sqrt(k) * fadeIn;
      const col = q.type === 'smoke' ? '88,80,74' : '150,128,105';
      const gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.size);
      gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(q.x - q.size, q.y - q.size, q.size * 2, q.size * 2);
    } else if (q.type === 'debris') {
      g.save(); g.translate(q.x, q.y); g.rotate(q.rot); g.globalAlpha = Math.min(1, q.life / 0.4);
      g.fillStyle = q.color; g.beginPath();
      q.pts.forEach(([px, py], i) => i ? g.lineTo(px * q.size, py * q.size) : g.moveTo(px * q.size, py * q.size));
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(-q.size * 0.5, -q.size * 0.6, q.size * 0.7, q.size * 0.35);
      g.restore();
    }
  }
  // pass 2: things that glow (added on top with 'lighter' blending)
  g.globalCompositeOperation = 'lighter';
  for (const q of particles) {
    if (q.delay > 0) continue;
    const k = q.life / q.max;
    if (q.type === 'fire') {
      const [r, gg, b] = fireColor(1 - k), a = 0.85 * k;
      const gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.size);
      gr.addColorStop(0, `rgba(${r},${gg},${b},${a})`); gr.addColorStop(0.5, `rgba(${r},${Math.max(0, gg - 60)},${b},${a * 0.5})`); gr.addColorStop(1, `rgba(${r},0,0,0)`);
      g.fillStyle = gr; g.fillRect(q.x - q.size, q.y - q.size, q.size * 2, q.size * 2);
    } else if (q.type === 'spark' || q.type === 'ember') {
      g.globalAlpha = Math.min(1, k * 1.5); g.strokeStyle = q.color; g.lineWidth = q.size; g.lineCap = 'round';
      const tail = q.type === 'spark' ? 0.025 : 0.04;
      g.beginPath(); g.moveTo(q.x, q.y); g.lineTo(q.x - q.vx * tail, q.y - q.vy * tail); g.stroke();
      if (q.type === 'ember') glow(g, q.x, q.y, 2.5, `rgba(255,140,40,${0.5 * k})`);
      g.globalAlpha = 1;
    } else if (q.type === 'ring') {
      g.strokeStyle = `rgba(255,235,200,${0.7 * k})`; g.lineWidth = 0.4 + 2.4 * k;
      g.beginPath(); g.arc(q.x, q.y, q.size, 0, Math.PI * 2); g.stroke();
    }
  }
  g.globalCompositeOperation = 'source-over'; g.lineCap = 'butt';
}

function drawGlowsHD(g) {   // soft coloured light from lava, lanterns, the helmet lamp and blasts
  const c0 = roomX * ROOM_COLS, r0 = roomY * ROOM_ROWS;
  g.globalCompositeOperation = 'lighter';
  for (let r = r0; r < r0 + ROOM_ROWS; r++) for (let c = c0; c < c0 + ROOM_COLS; c++)
    if (tileAt(c, r) === 'L') glow(g, c * TILE + 8, r * TILE + 8, 26, `rgba(255,90,20,${0.16 + 0.05 * Math.sin(globalT * 3 + c)})`);
  for (const l of lanterns) if (l.lit) glow(g, l.x + 4, l.y + 7, 46 + Math.sin(globalT * 13) * 1.5, 'rgba(255,185,90,0.28)');
  if (state === 'playing' || state === 'levelDone') { const lp = lampPos(); glow(g, lp.x, lp.y, 9, 'rgba(255,250,210,0.35)'); }
  for (const q of particles) if (q.type === 'light') {
    const k = q.life / q.max;
    glow(g, q.x, q.y, q.size * (0.6 + 0.4 * (1 - k)), `rgba(255,190,110,${0.75 * k})`);
  }
  g.globalCompositeOperation = 'source-over';
}

// RENDER: pick the target, draw the frame, then (classic) scale it up
// ---------------------------------------------------------------------
function render() {
  loadTextures();
  if (HD) { ctx = mainCtx; ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.imageSmoothingEnabled = true; }
  else    { ctx = lowCtx;  ctx.setTransform(1, 0, 0, 1, 0, 0); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  if (state === 'title') { HD ? drawTitleHD() : drawTitle(); }
  else {
    rect(0, 0, SCREEN_W, SCREEN_H, '#000');
    const sx = shake > 0 ? rnd(-1, 1) * shake * 6 : 0, sy = shake > 0 ? rnd(-1, 1) * shake * 6 : 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
    ctx.translate(-roomX * VIEW_W + sx, -roomY * VIEW_H + sy);     // camera = current room (+ shake)
    if (HD) drawWorldHD();
    else { drawTiles(); drawLanterns(); drawMiner(); drawEnemies(); drawDynamite(); drawNuggets(); drawPlayer(); drawParticles(); drawTextParticles(); }
    ctx.restore();
    if (flash > 0) { ctx.globalAlpha = HD ? 0.55 * flash / 0.12 : 0.85; rect(0, 0, VIEW_W, VIEW_H, '#fff8e0'); ctx.globalAlpha = 1; }
    if (HD) {   // gentle vignette
      const v = ctx.createRadialGradient(160, 88, 70, 160, 88, 210);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    HD ? drawHUDHD() : drawHUD();
    if (paused) centerBanner([['PAUSED', '#f0d030'], ['press P to continue']]);
    else if (state === 'levelDone') centerBanner([['MINER RESCUED!', '#40e040'], ['counting bonus...']]);
    else if (state === 'gameover') centerBanner([['GAME OVER', '#ff5040'], ['score ' + score + '   money $' + money], ['press Enter']]);
    else if (state === 'win') centerBanner([['ALL MINERS RESCUED!', '#40e040'], ['score ' + score + '   money $' + money], ['press Enter']]);
  }

  if (!HD) {   // blow the 320x200 frame up to the big canvas with no smoothing
    mainCtx.setTransform(1, 0, 0, 1, 0, 0); mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(lowCanvas, 0, 0, canvas.width, canvas.height);
  }
}

const sliderSyncs = [];
(function buildTuningPanel() {
  const box = document.getElementById('sliders');
  for (const item of SLIDERS) {
    if (typeof item === 'string') { const h = document.createElement('h4'); h.textContent = item; box.appendChild(h); continue; }
    const [key, label, min, max, stepSize, obj = PHYS, onChange] = item;
    const row = document.createElement('label'); row.className = 'srow';
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${stepSize}"><output></output>`;
    const input = row.querySelector('input'), out = row.querySelector('output');
    const sync = () => { input.value = obj[key]; out.textContent = obj[key]; if (onChange) onChange(); };
    input.addEventListener('input', () => { obj[key] = +input.value; out.textContent = input.value; if (onChange) onChange(); });
    input.addEventListener('change', () => canvas.focus());   // hand the keyboard back to the game
    box.appendChild(row); sliderSyncs.push(sync); sync();

  const hint = document.createElement('div'); hint.className = 'hint';

  box.appendChild(hint);
  // live gain-reduction meter: how many dB the compressor is turning the mix down right now
  const meter = document.createElement('div'); meter.className = 'hint'; meter.id = 'grMeter';
  meter.innerHTML = 'Compressing: <span id="grVal">0.0</span> dB <div style="background:#333;height:5px;width:200px;border-radius:3px"><div id="grBar" style="background:#ff8040;height:5px;width:0;border-radius:3px"></div></div>';
  box.appendChild(meter);
  document.getElementById('resetPhys').addEventListener('click', () => {

    sliderSyncs.forEach(f => f()); canvas.focus();
  });
  document.getElementById('copyPhys').addEventListener('click', () => {
    const txt = 'const PHYS_DEFAULTS = ' + JSON.stringify(PHYS, null, 2) + ';\n' +

    document.getElementById('physOut').textContent = txt;    // also shown, in case copying is blocked
    try { navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}

  });
})();

// ---------------------------------------------------------------------
// 7. MAIN LOOP — fixed 60 updates per second, draw once per frame
// ---------------------------------------------------------------------
const STEP = 1 / 60;
const grVal = document.getElementById('grVal'), grBar = document.getElementById('grBar');
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  render();
  updateSoundLoops();
  if (compNode && grVal) {   // update the compression meter in the tuning panel
    const gr = typeof compNode.reduction === 'number' ? compNode.reduction : compNode.reduction.value;
    grVal.textContent = gr.toFixed(1); grBar.style.width = Math.min(200, -gr * 10) + 'px';
  }
  requestAnimationFrame(frame);
}
function fit() {   // fill the window while keeping the 320x200 (8:5) shape
  const s = Math.max(0.5, Math.min(innerWidth / SCREEN_W, (innerHeight - 50) / SCREEN_H));
  canvas.style.width = Math.floor(SCREEN_W * s) + 'px'; canvas.style.height = Math.floor(SCREEN_H * s) + 'px';
}
addEventListener('resize', fit); fit(); applyGfxMode();
canvas.focus();
requestAnimationFrame(frame);
